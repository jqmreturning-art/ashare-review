<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股 & 美股 每日复盘 · 三合一导航</title>
<style>
:root{
  --red:#ff4757;--green:#00d4aa;
  --bg:#f4f6fa;--card:#ffffff;--line:#e3e8f0;
  --txt:#1f2937;--sub:#6b7280;--muted:#9ca3af;
  --blue:#1d4ed8;--purple:#6d28d9;
  --grad:linear-gradient(135deg,#1e3a8a,#4f46e5 60%,#7c3aed);
  --radius:14px;--shadow:0 1px 3px rgba(16,24,40,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt)}
header{background:var(--grad);color:#fff;padding:30px 0 0;border-radius:0 0 24px 24px}
.hd-in{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.hd-tag{font-size:12px;letter-spacing:2px;opacity:.85;background:rgba(255,255,255,.15);display:inline-block;padding:4px 12px;border-radius:20px;margin-bottom:12px}
.brand h1{font-size:26px;font-weight:700;letter-spacing:1px}
.brand p{font-size:13px;opacity:.9;margin-top:6px}
.badge{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:10px 20px;text-align:center;backdrop-filter:blur(4px)}
.badge .num{font-size:32px;font-weight:700;line-height:1.1}
.badge .lbl{font-size:12px;opacity:.9;margin-top:2px}
.tabs{display:flex;gap:6px;max-width:1200px;margin:22px auto 0;padding:0 12px;width:100%}
.tab{padding:12px 20px;font-size:13px;font-weight:600;color:rgba(255,255,255,.75);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);border-radius:12px 12px 0 0;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap}
.tab:hover{color:#fff;background:rgba(255,255,255,.18)}
.tab.active{color:var(--blue);background:#fff;border-color:#fff;box-shadow:0 -4px 14px rgba(16,24,40,.08)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);flex-shrink:0}
.tab.active .dot{background:var(--green)}
.tab .mini{font-size:10px;font-weight:400;opacity:.8}
main{position:relative;background:var(--card);min-height:60vh}
iframe{width:100%;border:none;display:none}
iframe.active{display:block}
footer{background:var(--card);border-top:1px solid var(--line);padding:10px 20px;text-align:center;font-size:11px;color:var(--muted)}
@media(max-width:640px){
.hd-in{flex-direction:column;align-items:flex-start}
.tab{padding:10px 12px;font-size:12px}
.tab .mini{display:none}
}
</style>
</head>
<body>
<header>
  <div class="hd-in">
    <div class="brand">
      <span class="hd-tag">DAILY REVIEW · 每日复盘导航</span>
      <h1>A股 & 美股 每日复盘</h1>
      <p>隔夜美股 · A股大盘 · A股AI产业链 · 每交易日自动更新</p>
    </div>
    <div class="badge">
      <div class="num">3</div>
      <div class="lbl">份报告 · 交易日更新</div>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-target="us"><span class="dot"></span>美股科技<span class="mini">07:00</span></button>
    <button class="tab" data-target="market"><span class="dot"></span>A股大盘<span class="mini">15:01</span></button>
    <button class="tab" data-target="ai"><span class="dot"></span>A股AI产业链<span class="mini">15:01</span></button>
  </nav>
</header>
<main>
  <iframe data-name="us" src="./us-review/" class="active" title="美股科技板块日度复盘"></iframe>
  <iframe data-name="market" src="./market-review/" title="A股收盘主线与情绪复盘"></iframe>
  <iframe data-name="ai" src="./ai-review/" title="A股AI产业链日度复盘"></iframe>
</main>
<footer>收盘静态快照，仅供参考，不构成任何投资建议 ｜ 更新时段：美股 07:00 ｜ A股 15:01</footer>
<script>
(function(){
  var tabs=document.querySelectorAll('.tab');
  var frames=document.querySelectorAll('iframe');
  function fit(f){
    try{
      var doc=f.contentWindow.document;
      f.style.height=Math.max(doc.body.scrollHeight,doc.documentElement.scrollHeight)+'px';
    }catch(e){}
  }
  tabs.forEach(function(t){
    t.addEventListener('click',function(){
      tabs.forEach(function(x){x.classList.remove('active')});
      t.classList.add('active');
      frames.forEach(function(f){
        var act=f.getAttribute('data-name')===t.getAttribute('data-target');
        f.classList.toggle('active', act);
        if(act) setTimeout(function(){fit(f)},50);
      });
    });
  });
  frames.forEach(function(f){f.addEventListener('load',function(){fit(f)});fit(f)});
})();
</script>
</body>
</html>
