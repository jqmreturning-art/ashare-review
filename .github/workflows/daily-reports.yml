name: daily-reports

on:
  schedule:
    # 北京时间 16:00 = UTC 08:00（A股收盘复盘）
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '报告日期 YYYYMMDD（留空用当天）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  a-share:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests openpyxl

      - name: Configure git identity
        run: |
          git config --global user.name "jqmreturning-art"
          git config --global user.email "jqmreturning@gmail.com"

      - name: Run A-share reports
        env:
          CLOUD_REPO: ${{ github.workspace }}
          CLOUD_SKIP_PUSH: '1'
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          cd cloud
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python main.py cn "$DATE"
          else
            python main.py cn
          fi

      - name: Commit and push reports
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "A股复盘 $(date +%Y-%m-%d): 云端自动生成"
          git push "https://x-access-token:${{ secrets.GH_PAT }}@github.com/jqmreturning-art/ashare-review.git" main:main
