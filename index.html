<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A股 &amp; 美股 每日复盘 · 三合一导航</title>
<style>
:root{--bg:#f5f7fb;--card:#ffffff;--line:#e5e9f2;--text:#1a2233;--muted:#6b7280;--blue:#1d4ed8;--purple:#7c3aed;--red:#ff4757;--green:#00d4aa}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.head-top{max-width:1200px;margin:0 auto;width:100%;padding:14px 20px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:0}
.brand h1{font-size:16px;color:var(--text);font-weight:700;line-height:1.3}
.brand p{font-size:11px;color:var(--muted);margin-top:2px}
.head-meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.7}
.head-meta b{color:var(--blue);font-weight:600}
.tabs{display:flex;gap:2px;max-width:1200px;margin:0 auto;width:100%;padding:0 12px}
.tab{padding:12px 20px;font-size:13px;font-weight:600;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:7px;transition:color .15s,border-color .15s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:#cbd5e1;flex-shrink:0}
.tab.active .dot{background:var(--blue)}
.tab .mini{font-size:10px;color:var(--muted);font-weight:400}
main{flex:1;overflow:hidden;position:relative;background:var(--card)}
iframe{width:100%;height:100%;border:none;display:none}
iframe.active{display:block}
@media(max-width:640px){
.head-top{flex-direction:column;align-items:flex-start;gap:6px}
.head-meta{text-align:left}
.tab{padding:12px 12px;font-size:12px}
.tab .mini{display:none}
}
</style>
</head>
<body>
<header>
  <div class="head-top">
    <div class="brand">
      <div class="logo">复盘</div>
      <div>
        <h1>A股 &amp; 美股 每日复盘</h1>
        <p>隔夜美股 · A股大盘 · A股AI产业链 · 每交易日自动更新</p>
      </div>
    </div>
    <div class="head-meta">收盘静态快照，仅供参考<br>不构成任何投资建议</div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab active" data-target="us"><span class="dot"></span>美股科技<span class="mini">07:00</span></button>
    <button class="tab" data-target="market"><span class="dot"></span>A股大盘<span class="mini">15:01</span></button>
    <button class="tab" data-target="ai"><span class="dot"></span>A股AI产业链<span class="mini">15:01</span></button>
  </nav>
</header>
<main>
  <iframe data-name="us" src="./us-review/" class="active" title="美股科技板块日度复盘"></iframe>
  <iframe data-name="market" src="./market-review/" title="A股收盘主线与情绪复盘"></iframe>
  <iframe data-name="ai" src="./ai-review/" title="A股AI产业链日度复盘"></iframe>
</main>
<script>
(function(){
  var tabs=document.querySelectorAll('.tab');
  var frames=document.querySelectorAll('iframe');
  tabs.forEach(function(t){
    t.addEventListener('click',function(){
      tabs.forEach(function(x){x.classList.remove('active')});
      t.classList.add('active');
      frames.forEach(function(f){
        f.classList.toggle('active', f.getAttribute('data-name')===t.getAttribute('data-target'));
      });
    });
  });
})();
</script>
</body>
</html>
